name: Build iOS App

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release
      export_method:
        description: 'Export method'
        required: true
        default: 'ad-hoc'
        type: choice
        options:
          - app-store
          - ad-hoc
          - enterprise
          - development

env:
  XCODE_VERSION: '15.4'
  SCHEME: 'ScreenCast'
  BUNDLE_ID: 'com.screencast.receiver'

jobs:
  build-ipa:
    name: Build IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Install xcbeautify
        run: brew install xcbeautify || true

      - name: Build using Swift Package Manager
        working-directory: ./iOS
        run: |
          # Build the SPM package directly - no Xcode project needed
          swift build -c release --arch arm64 --target ScreenCast 2>&1 | xcbeautify || \
          swift build -c release --target ScreenCast 2>&1 | xcbeautify

      - name: Build Xcode project with WebRTC via SPM
        working-directory: ./iOS
        env:
          CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
        run: |
          # Resolve Swift Package dependencies first
          xcodebuild -resolvePackageDependencies \
            -scheme ${{ env.SCHEME }} \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath ./Packages 2>&1 | xcbeautify || true

          # Build the app
          xcodebuild clean archive \
            -scheme ${{ env.SCHEME }} \
            -configuration ${{ env.CONFIGURATION }} \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/ios/${{ env.SCHEME }}.xcarchive \
            -clonedSourcePackagesDirPath ./Packages \
            -derivedDataPath ../build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | xcbeautify

      - name: Export IPA
        working-directory: ./iOS
        run: |
          xcodebuild -exportArchive \
            -archivePath ../build/ios/${{ env.SCHEME }}.xcarchive \
            -exportPath ../build/ios/ipa \
            -exportOptionsPlist ExportOptions.plist 2>&1 | xcbeautify || true

      - name: Verify IPA
        run: |
          ls -la ./build/ios/ipa/
          IPA_PATH=$(find ./build/ios/ipa -name "*.ipa" | head -1)
          if [ -f "$IPA_PATH" ]; then
            echo "IPA found: $IPA_PATH"
            unzip -l "$IPA_PATH" | head -30
          else
            echo "ERROR: No IPA found!"
            find ./build -name "*.ipa" -o -name "*.xcarchive" 2>/dev/null | head -20
            exit 1
          fi

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCast-iOS-${{ github.event.inputs.configuration || 'Release' }}
          path: ./build/ios/ipa/*.ipa
          retention-days: 30
          compression-level: 6

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./build/ios/ipa/*.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
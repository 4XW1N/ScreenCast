name: Build iOS App

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

env:
  XCODE_VERSION: '15.4'

jobs:
  build-ipa:
    name: Build IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Build Universal App (iPhone + iPad)
        working-directory: ./iOS
        run: |
          xcodebuild \
            -scheme ScreenCast \
            -configuration ${{ github.event.inputs.configuration || 'Release' }} \
            -destination 'generic/platform=iOS' \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            TARGETED_DEVICE_FAMILY=1,2 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1

      - name: Package IPA
        working-directory: ./iOS
        run: |
          APP_PATH=$(find build/DerivedData -name "*.app" -path "*Release-iphoneos*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Built .app not found"
            find build/DerivedData -name "*.app" -type d
            exit 1
          fi
          
          echo "Found app at: $APP_PATH"
          
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          
          cd build/ipa
          zip -r ../ScreenCast.ipa Payload
          
          echo "IPA created at: $(pwd)/ScreenCast.ipa"
          ls -la ../ScreenCast.ipa

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCast-iOS-${{ github.event.inputs.configuration || 'Release' }}
          path: ./iOS/build/ScreenCast.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ScreenCast iOS v1.0.${{ github.run_number }}
          body: |
            ## ScreenCast iOS Receiver - Auto Build

            ### Download
            - **IPA**: Download the `ScreenCast.ipa` asset below

            ### How to Install
            1. Download `ScreenCast.ipa` from the release
            2. Install via AltStore/Sideloadly
            3. Open the app and enter your Android phone's IP address
            4. Tap Connect

            ### How to Use
            1. Start casting on Android phone
            2. On iPad, enter Android IP (e.g., `192.168.1.50`)
            3. Tap Connect - Android screen appears on iPad!

          files: ./iOS/build/ScreenCast.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
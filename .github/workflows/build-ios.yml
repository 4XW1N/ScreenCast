name: Build iOS App

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release
      export_method:
        description: 'Export method'
        required: true
        default: 'ad-hoc'
        type: choice
        options:
          - app-store
          - ad-hoc
          - enterprise
          - development

env:
  XCODE_VERSION: '15.4'
  IOS_DEPLOYMENT_TARGET: '15.0'
  SCHEME: 'ScreenCast'
  BUNDLE_ID: 'com.screencast.receiver'

jobs:
  build-ipa:
    name: Build IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Install xcbeautify
        run: |
          brew install xcbeautify || true

      - name: Resolve Swift Package dependencies
        working-directory: ./iOS
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme ${{ env.SCHEME }} \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath ./Packages \
            | xcbeautify

      - name: Create ExportOptions.plist
        working-directory: ./iOS
        run: |
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${{ github.event.inputs.export_method || 'ad-hoc' }}</string>
              <key>compileBitcode</key>
              <false/>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string>$(DEVELOPMENT_TEAM)</string>
              <key>thinning</key>
              <string><none></string>
          </dict>
          </plist>
          EOF

      - name: Build and Archive
        working-directory: ./iOS
        env:
          CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
        run: |
          # Build using the SPM package directly
          xcodebuild clean archive \
            -scheme ${{ env.SCHEME }} \
            -configuration ${{ env.CONFIGURATION }} \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/ios/${{ env.SCHEME }}.xcarchive \
            -clonedSourcePackagesDirPath ./Packages \
            -derivedDataPath ../build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcbeautify

      - name: Export IPA
        working-directory: ./iOS
        run: |
          xcodebuild -exportArchive \
            -archivePath ../build/ios/${{ env.SCHEME }}.xcarchive \
            -exportPath ../build/ios/ipa \
            -exportOptionsPlist ExportOptions.plist \
            | xcbeautify

      - name: Verify IPA
        run: |
          ls -la ./build/ios/ipa/
          IPA_PATH=$(find ./build/ios/ipa -name "*.ipa" | head -1)
          if [ -f "$IPA_PATH" ]; then
            echo "IPA found: $IPA_PATH"
            echo "IPA_SIZE=$(stat -f%z "$IPA_PATH")" >> $GITHUB_ENV
            unzip -l "$IPA_PATH" | head -30
          else
            echo "ERROR: No IPA found!"
            find ./build -name "*.ipa" -o -name "*.xcarchive" | head -20
            exit 1
          fi

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCast-iOS-${{ env.CONFIGURATION }}
          path: ./build/ios/ipa/*.ipa
          retention-days: 30
          compression-level: 6

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./build/ios/ipa/*.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to TestFlight (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.APP_STORE_CONNECT_ISSUER_ID != ''
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ./build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
name: Build iOS App

on:
  push:
    branches: [main, develop, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

env:
  XCODE_VERSION: '15.4'

jobs:
  build-ipa:
    name: Build IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Build with xcodebuild (iOS device)
        working-directory: ./iOS
        env:
          CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
        run: |
          xcodebuild build \
            -scheme ScreenCast \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Create app bundle
        working-directory: ./iOS
        run: |
          # Find the built binary in DerivedData
          BINARY=$(find build/DerivedData -name "ScreenCast" -type f -executable | head -1)
          if [ -z "$BINARY" ]; then
            echo "Binary not found in DerivedData!"
            find build/DerivedData -type f -executable 2>/dev/null | head -20
            exit 1
          fi
          echo "Found binary: $BINARY"

          # Create iOS app bundle structure (flat, not macOS Contents/)
          APP_DIR="build/ScreenCast.app"
          rm -rf "$APP_DIR"
          mkdir -p "$APP_DIR"
          mkdir -p "$APP_DIR/_CodeSignature"

          # Copy binary
          cp "$BINARY" "$APP_DIR/ScreenCast"
          chmod +x "$APP_DIR/ScreenCast"

          # Create Info.plist
          cat > "$APP_DIR/Info.plist" << 'PLISTEOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleDevelopmentRegion</key>
    <string>en</string>
    <key>CFBundleExecutable</key>
    <string>ScreenCast</string>
    <key>CFBundleIdentifier</key>
    <string>com.screencast.receiver</string>
    <key>CFBundleInfoDictionaryVersion</key>
    <string>6.0</string>
    <key>CFBundleName</key>
    <string>ScreenCast</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleShortVersionString</key>
    <string>1.0.2</string>
    <key>CFBundleVersion</key>
    <string>5</string>
    <key>LSRequiresIPhoneOS</key>
    <true/>
    <key>UILaunchScreen</key>
    <dict/>
    <key>UISupportedInterfaceOrientations</key>
    <array>
        <string>UIInterfaceOrientationPortrait</string>
        <string>UIInterfaceOrientationLandscapeLeft</string>
        <string>UIInterfaceOrientationLandscapeRight</string>
    </array>
    <key>UISupportedInterfaceOrientations~ipad</key>
    <array>
        <string>UIInterfaceOrientationPortrait</string>
        <string>UIInterfaceOrientationPortraitUpsideDown</string>
        <string>UIInterfaceOrientationLandscapeLeft</string>
        <string>UIInterfaceOrientationLandscapeRight</string>
    </array>
    <key>UIDeviceFamily</key>
    <array>
        <integer>1</integer>
        <integer>2</integer>
    </array>
    <key>UIRequiresFullScreen</key>
    <true/>
</dict>
</plist>
PLISTEOF

          # Create PkgInfo
          echo "APPL????" > "$APP_DIR/PkgInfo"

          # Verify bundle structure
          echo "--- App bundle contents ---"
          ls -la "$APP_DIR"
          find "$APP_DIR" -type f

      - name: Verify binary architecture
        working-directory: ./iOS
        run: |
          lipo -info build/ScreenCast.app/ScreenCast

      - name: Package IPA
        working-directory: ./iOS
        run: |
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R build/ScreenCast.app build/ipa/Payload/
          cd build/ipa
          zip -qr ../ScreenCast.ipa Payload
          echo "IPA created:"
          unzip -l ../ScreenCast.ipa | head -25
          ls -la ../ScreenCast.ipa

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCast-iOS-${{ github.event.inputs.configuration || 'Release' }}
          path: ./iOS/build/ScreenCast.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ScreenCast iOS v1.0.${{ github.run_number }}
          body: |
            ## ScreenCast iOS Receiver - Auto Build

            ### How to Install
            1. Download the `ScreenCast.ipa` asset
            2. Sideload using AltStore or Sideloadly
            3. Open the app on your iPad

            ### How to Use
            1. Start casting on Android phone
            2. On iPad, enter Android phone's IP address
            3. Tap Connect
          files: ./iOS/build/ScreenCast.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build iOS App

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

env:
  XCODE_VERSION: '15.4'

jobs:
  build-ipa:
    name: Build IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Install xcbeautify
        run: brew install xcbeautify || true

      - name: Build and Archive
        working-directory: ./iOS
        env:
          CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
        run: |
          set -o pipefail
          xcodebuild clean archive \
            -scheme ScreenCast \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/ScreenCast.xcarchive" \
            -derivedDataPath "$PWD/build/DerivedData" \
            TARGETED_DEVICE_FAMILY="1,2" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | xcbeautify

      - name: Package IPA manually
        working-directory: ./iOS
        run: |
          APP_PATH=$(find build/DerivedData -name "*.app" -path "*iphoneos*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Built .app not found. Contents of DerivedData:"
            find build/DerivedData -type d -name "*.app"
            find build/DerivedData -maxdepth 4 -type d
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -qr ../ScreenCast.ipa Payload
          echo "IPA created:"
          ls -la ../ScreenCast.ipa

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCast-iOS-${{ github.event.inputs.configuration || 'Release' }}
          path: ./iOS/build/ScreenCast.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ScreenCast iOS v1.0.${{ github.run_number }}
          body: |
            ## ScreenCast iOS Receiver - Auto Build

            ### How to Install
            1. Download the `ScreenCast.ipa` asset
            2. Sideload using AltStore or Sideloadly
            3. Open the app on your iPad

            ### How to Use
            1. Start casting on Android phone
            2. On iPad, enter Android phone's IP address
            3. Tap Connect
          files: ./iOS/build/ScreenCast.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

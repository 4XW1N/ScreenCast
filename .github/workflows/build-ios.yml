name: Build iOS App

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

env:
  XCODE_VERSION: '15.4'

jobs:
  build-ipa:
    name: Build IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Build with xcodebuild for iOS SDK
        working-directory: ./iOS
        run: |
          xcodebuild \
            -scheme ScreenCast \
            -configuration ${{ github.event.inputs.configuration || 'Release' }} \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/Packages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1

      - name: Package IPA from SPM executable
        working-directory: ./iOS
        run: |
          BINARY_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "ScreenCast" -type f | head -1)
          if [ -z "$BINARY_PATH" ]; then
            echo "ERROR: Built binary not found"
            find build/DerivedData -name "ScreenCast" -type f
            exit 1
          fi
          
          echo "Found binary at: $BINARY_PATH"
          file "$BINARY_PATH"
          
          APP_DIR="../build/ios/ipa/Payload/ScreenCast.app"
          mkdir -p "$APP_DIR"
          cp "$BINARY_PATH" "$APP_DIR/ScreenCast"
          chmod +x "$APP_DIR/ScreenCast"
          
          cat > "$APP_DIR/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>ScreenCast</string>
              <key>CFBundleIdentifier</key>
              <string>com.screencast.receiver</string>
              <key>CFBundleName</key>
              <string>ScreenCast</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF
          
          cd ../build/ios/ipa
          zip -r ScreenCast.ipa Payload
          
          echo "IPA created at: $(pwd)/ScreenCast.ipa"
          ls -la ScreenCast.ipa

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCast-iOS-${{ github.event.inputs.configuration || 'Release' }}
          path: ./build/ios/ipa/*.ipa
          retention-days: 30
          compression-level: 6

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ScreenCast iOS v1.0.${{ github.run_number }}
          body: |
            ## ScreenCast iOS Receiver - Auto Build

            ### Download
            - **IPA**: Download the `ScreenCast.ipa` asset below

            ### How to Install
            1. Install [AltStore](https://altstore.io) or [Sideloadly](https://sideloadly.io) on your Mac/PC
            2. Connect your iPad via USB
            3. Sideload `ScreenCast.ipa` to your iPad
            4. Open the app and enter your Android phone's IP address
            5. Tap Connect

            ### How to Use
            1. Start casting on Android phone
            2. On iPad, enter Android IP (e.g., `192.168.1.50`)
            3. Tap Connect - Android screen appears on iPad!

          files: ./build/ios/ipa/*.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
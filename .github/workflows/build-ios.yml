name: Build iOS App

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

env:
  XCODE_VERSION: '15.4'

jobs:
  build-ipa:
    name: Build IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Build with xcodebuild for iOS SDK
        working-directory: ./iOS
        run: |
          xcodebuild \
            -scheme ScreenCast \
            -configuration ${{ github.event.inputs.configuration || 'Release' }} \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/Packages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1

      - name: Find and package IPA
        working-directory: ./iOS
        run: |
          # Find the built .app
          APP_PATH=$(find build/DerivedData -name "*.app" -path "*Release-iphoneos*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Built .app not found"
            find build/DerivedData -name "*.app" -type d
            exit 1
          fi
          
          echo "Found app at: $APP_PATH"
          
          # Create IPA structure
          mkdir -p ../build/ios/ipa/Payload
          cp -R "$APP_PATH" ../build/ios/ipa/Payload/
          
          # Create Info.plist if not present
          if [ ! -f "../build/ios/ipa/Payload/$(basename "$APP_PATH")/Info.plist" ]; then
            cat > "../build/ios/ipa/Payload/$(basename "$APP_PATH")/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>ScreenCast</string>
              <key>CFBundleIdentifier</key>
              <string>com.screencast.receiver</string>
              <key>CFBundleName</key>
              <string>ScreenCast</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          PLIST
          fi
          
          # Create IPA (ZIP file)
          cd ../build/ios/ipa
          zip -r ../ScreenCast.ipa Payload
          
          echo "IPA created at: ../build/ios/ScreenCast.ipa"
          ls -la ../build/ios/ScreenCast.ipa

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCast-iOS-${{ github.event.inputs.configuration || 'Release' }}
          path: ./build/ios/*.ipa
          retention-days: 30
          compression-level: 6

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./build/ios/*.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
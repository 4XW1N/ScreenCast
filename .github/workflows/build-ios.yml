name: Build iOS App

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

env:
  XCODE_VERSION: '15.4'

jobs:
  build-ipa:
    name: Build IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Install xcbeautify
        run: brew install xcbeautify || true

      - name: Build and Archive
        working-directory: ./iOS
        env:
          CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
        run: |
          xcodebuild clean archive \
            -scheme ScreenCast \
            -configuration $CONFIGURATION \
            -sdk iphoneos \
            -archivePath $PWD/build/ScreenCast.xcarchive \
            -derivedDataPath $PWD/build/DerivedData \
            TARGETED_DEVICE_FAMILY="1,2" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | xcbeautify

      - name: Create ExportOptions.plist
        working-directory: ./iOS
        run: |
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>thinning</key>
              <string><none></string>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        working-directory: ./iOS
        run: |
          xcodebuild -exportArchive \
            -archivePath $PWD/build/ScreenCast.xcarchive \
            -exportPath $PWD/build/ipa \
            -exportOptionsPlist ExportOptions.plist \
            2>&1 | xcbeautify

      - name: Verify IPA
        run: |
          ls -la /home/aswin/ScreenCast/iOS/build/ipa/
          IPA_PATH=$(find /home/aswin/ScreenCast/iOS/build/ipa -name "*.ipa" | head -1)
          if [ -f "$IPA_PATH" ]; then
            echo "IPA found: $IPA_PATH"
            ls -la "$IPA_PATH"
          else
            echo "ERROR: No IPA found!"
            exit 1
          fi

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCast-iOS-${{ github.event.inputs.configuration || 'Release' }}
          path: ./iOS/build/ipa/*.ipa
          retention-days: 30
          compression-level: 6

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ScreenCast iOS v1.0.${{ github.run_number }}
          body: |
            ## ScreenCast iOS Receiver - Auto Build

            ### How to Install
            1. Download the `.ipa` file from Artifacts
            2. Sideload using AltStore, Sideloadly, or similar tool
            3. Open the app on your iPad

            ### How to Use
            1. Start casting on Android phone
            2. On iPad, enter Android phone's IP address
            3. Tap Connect

          files: ./iOS/build/ipa/*.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
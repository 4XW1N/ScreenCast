name: Build iOS App

on:
  push:
    branches: [main, develop, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

permissions:
  contents: write

env:
  XCODE_VERSION: '15.4'

jobs:
  build-ipa:
    name: Build IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Build app bundle and IPA
        working-directory: ./iOS
        env:
          CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
        run: |
          chmod +x build_app_bundle.sh
          ./build_app_bundle.sh "$CONFIGURATION"

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCast-iOS-${{ github.event.inputs.configuration || 'Release' }}
          path: ./iOS/build/ScreenCast.ipa
          retention-days: 30

      - name: Create GitHub Release (skipped)
        if: false
        run: echo "Release creation disabled - use existing release v1.0.2"


            ### How to Install
            1. Download the `ScreenCast.ipa` asset
            2. Sideload using AltStore or Sideloadly
            3. Open the app on your iPad

            ### How to Use
            1. Start casting on Android phone
            2. On iPad, enter Android phone's IP address
            3. Tap Connect
          files: ./iOS/build/ScreenCast.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

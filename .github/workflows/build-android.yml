name: Build Android App

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

env:
  JAVA_VERSION: '17'

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./Android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.2

      - name: Download WebRTC AAR
        run: |
          mkdir -p app/libs
          curl -L -o app/libs/webrtc.aar "https://storage.googleapis.com/webrtc-builds/android/webrtc-114.0.0.aar" || \
          curl -L -o app/libs/webrtc.aar "https://github.com/stasel/WebRTC-Android-Prebuilts/raw/main/webrtc-114.0.0.aar"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        if: github.event.inputs.build_type == 'Debug' || github.event_name != 'workflow_dispatch'
        run: ./gradlew assembleDebug

      - name: Build Release APK
        if: github.event.inputs.build_type == 'Release'
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        if: github.event.inputs.build_type == 'Debug' || github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCast-Android-Debug
          path: Android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        if: github.event.inputs.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCast-Android-Release
          path: Android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Android/app/build/outputs/apk/release/*.apk
            Android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
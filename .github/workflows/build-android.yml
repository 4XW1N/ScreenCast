name: Build Android App

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

env:
  JAVA_VERSION: '17'

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./Android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Sign APK
        run: |
          /home/aswin/jdk-17.0.2/bin/keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          /home/aswin/Android/Sdk/build-tools/34.0.0/apksigner sign --ks debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCast-Android-Release
          path: Android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ScreenCast Android v1.0.${{ github.run_number }}
          body: |
            ## ScreenCast Android Sender - Auto Build

            ### Download
            - **APK**: Download the `app-release-unsigned.apk` asset below

            ### How to Install
            1. Download `app-release-unsigned.apk` to your Android phone
            2. Enable "Install unknown apps" in Settings if prompted
            3. Open the APK to install
            4. Open ScreenCast app

            ### How to Use
            1. Tap **"Start Casting"** on Android
            2. Grant screen capture permission
            3. Note the IP address shown (e.g., `192.168.1.50`)
            4. On iPad, enter this IP in the ScreenCast receiver app
            5. Tap Connect

          files: Android/app/build/outputs/apk/release/app-release-unsigned.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
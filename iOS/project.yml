name: ScreenCast
options:
  bundleIdPrefix: com.screencast
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "5"
targets:
  ScreenCast:
    type: application
    platform: iOS
    sources:
      - path: Sources/ScreenCast
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screencast.receiver
        PRODUCT_NAME: ScreenCast
        INFOPLIST_FILE: Sources/ScreenCast/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        SWIFT_EMIT_LOC_STRINGS: "NO"
        ENABLE_BITCODE: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
schemes:
  ScreenCast:
    build:
      targets:
        ScreenCast: all
    run:
      config: Release
    archive:
      config: Release
